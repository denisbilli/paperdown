name: Build & Release

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 18.x
      uses: actions/setup-node@v4
      with:
        node-version: 18.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build project
      run: npm run build

    - name: Package executables
      run: npx pkg .

    - name: Rename binaries
      run: |
        cd output
        mv paperdown-linux paperdown-linux-x64
        chmod +x paperdown-linux-x64
        mv paperdown-macos paperdown-macos-x64
        chmod +x paperdown-macos-x64
        mv paperdown-win.exe paperdown-windows-x64.exe  
      
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: paperdown-executables
        path: output/

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          output/paperdown-windows-x64.exe
          output/paperdown-linux-x64
          output/paperdown-macos-x64
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
